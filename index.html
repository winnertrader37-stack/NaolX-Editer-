const FX=['None','Vignette','Shake','Glow','Flash'],ANI=['None','Fade','Zoom in','Slide','Pop','Spin'],MSK=['None','Circle','Rectangle','Star'];

clip:[['Split','split',split],['Volume','vol',SH.Volume],['Animations','ani',SH.Animations],['Effects','fx',SH.Effects],['Delete','del',del],['Speed','spd',SH.Speed],['Audio','audio',()=>go('aud')],['Opacity','opa',SH.Opacity],['Mask','mask',SH.Mask],['Filters','fil',SH.Filters],['Adjust','adj',SH.Adjust],['Tracking','trk',SH.Track],['Duplicate','dup',dup]],
aud:[['Isolate voice','iso',()=>preset('Isolate voice')],['Reduce noise','nz',()=>preset('Reduce noise')],['Audio effects','eff',SH['Audio effects']],['Enhance voice','enh',()=>preset('Enhance voice')]],
audio:[['Sounds','mus',SH.Sounds],['Record','mic',SH.Record]],
text:[['Add text','text',()=>SH.Text(-1)],['Auto captions','cap',SH.Captions],['Stickers','stk',SH.Stickers]]});
function go(m){menu=m;sel=m=='clip'||m=='aud';$('#kf').style.visibility=sel?'visible':'hidden';rt();tbr()}
$('#kf').onclick=()=>sel&&SH.Keyframe();
function tbr(){const t=$('#tb');t.innerHTML='';const bt=$('#bot');bt.querySelector('.bk')?.remove();
 if(menu!='main'){const b=el('<button class="bk">‹</button>');b.onclick=()=>go(menu=='aud'?'clip':'main');bt.prepend(b)}
 MN()[menu].forEach(([lb,ic,fn])=>{const b=el(`<button class="ti">${ico(ic)}${lb}</button>`);b.onclick=fn;t.append(b)})}
$('#se').onclick=()=>{const q=prompt('Tool barbaadi (ex: speed, mask, captions)');if(!q)return;const k=Object.keys(SH).find(k=>k.toLowerCase().includes(q.toLowerCase()));if(!k)return toast('Hin argamne');if(k=='Text')SH.Text(-1);else if(k=='AudioClip')toast('Hin argamne');else{if(['Speed','Volume','Animations','Effects','Opacity','Mask','Adjust','Filters','Keyframe','Track'].includes(k)&&!segs.length)return;SH[k]()}};
/* captions */
function autoCap(){if(sr){sr.stop();sr=null;return SH.Captions()}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Browser kee speech recognition hin deeggaru. Chrome fayyadami.');
 sr=new SR();sr.lang=capLang;sr.continuous=true;sr.interimResults=false;let last=cur;snap();
 sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){caps.push({from:last,to:Math.max(cur,last+.8),text:e.results[i][0].transcript.trim()});last=cur;rt();sv()}};
 sr.onerror=e=>{toast('Auto captions: '+e.error+(e.error=='language-not-supported'?' — afaan kun hin deeggaramu, English yookaan Amharic yaali':''));sr=null};sr.onend=()=>{sr=null};
 try{sr.start();play();toast('Dhaggeeffachaa jira… viidiyoon taphataa jira')}catch(e){sr=null}}
/* tracking */
async function autoFace(){if(!('FaceDetector' in window))return toast('Auto face browser kee irratti hin jiru. Fuula tuquun filadhu.');try{const f=await new FaceDetector().detect(v);if(!f.length)return toast('Fuulli hin argamne');const b=f[0].boundingBox;tp={x:(b.x+b.width/2)/v.videoWidth,y:(b.y+b.height/2)/v.videoHeight,r:b.width/v.videoWidth/2};toast('Fuula argameera ✔')}catch(e){toast('Auto face hin hojjanne')}}
const sk=t=>new Promise(r=>{const f=()=>{v.removeEventListener('seeked',f);r()};v.addEventListener('seeked',f);v.currentTime=t});
async function runTrack(){if(!tp)return toast('Duraan canvas irratti fuula tuqi ykn Auto face cuqaasi');pause();const g=cg(),tw=180,th=Math.round(tw*v.videoHeight/v.videoWidth),c=document.createElement('canvas');c.width=tw;c.height=th;const x=c.getContext('2d',{willReadFrequently:true});
 const fd='FaceDetector' in window?new FaceDetector({fastMode:true,maxDetectedFaces:6}):null;
 const R=Math.round(clamp((tp.r||.07)*tw*.9,14,34)),SR=24,gray=()=>{x.drawImage(v,0,0,tw,th);const d=x.getImageData(0,0,tw,th).data,o=new Float32Array(tw*th);for(let i=0;i<o.length;i++)o[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;return o};
 const at=(f,X,Y)=>f[clamp(Y,0,th-1)*tw+clamp(X,0,tw-1)],patch=(f,a,b)=>{const o=[];for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++)o.push(at(f,a+i,b+j));return o};
 const save=cur;$('#ov').style.display='flex';let px=tp.x*tw,py=tp.y*th;await useSrc(g.m,g.s);let fr=gray(),tpl=patch(fr,Math.round(px),Math.round(py));const raw=[[g.s,px,py]],step=.05;
 for(let t=g.s+step;t<g.e;t+=step){$('#ov').textContent='Tracking… '+Math.round((t-g.s)/(g.e-g.s)*100)+'%';await sk(t);fr=gray();let nx=px,ny=py,ok=false;
  if(fd){try{const fs=await fd.detect(v);let bd=1e9;fs.forEach(f=>{const b=f.boundingBox,fx=(b.x+b.width/2)/v.videoWidth*tw,fy=(b.y+b.height/2)/v.videoHeight*th,d=Math.hypot(fx-px,fy-py);if(d<bd&&d<tw*.3){bd=d;nx=fx;ny=fy;ok=true}})}catch(e){}}
  if(!ok){let best=1e18,bx=0,by=0;const ix=Math.round(px),iy=Math.round(py);for(let dy=-SR;dy<=SR;dy++)for(let dx=-SR;dx<=SR;dx++){let sad=0;for(let j=-R;j<=R&&sad<best;j+=2)for(let i=-R;i<=R;i+=2)sad+=Math.abs(at(fr,ix+dx+i,iy+dy+j)-tpl[(j+R)*(2*R+1)+i+R]);if(sad<best){best=sad;bx=dx;by=dy}}nx=ix+bx;ny=iy+by}
  px=clamp(nx,0,tw-1);py=clamp(ny,0,th-1);const np=patch(fr,Math.round(px),Math.round(py));tpl=tpl.map((a,i)=>a*.85+np[i]*.15);raw.push([t,px,py])}
 const pts=raw.map((p,i)=>{let sx=0,sy=0,n=0;for(let k=-3;k<=3;k++){const q=raw[i+k];if(q){sx+=q[1];sy+=q[2];n++}}return[p[0],sx/n/tw,sy/n/th]});
 snap();g.tr={pts,kind:trk.kind,emoji:trk.emoji,size:trk.size,zoom:trk.zoom};$('#ov').style.display='none';setT(save);rt();sv();toast('Tracking xumurameera ✔ Taphachiisii ilaali')}
/* canvas input */
const cp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
cv.onpointerdown=e=>{const p=cp(e);if(sname=='Track'){const f=Math.min(W/v.videoWidth,H/v.videoHeight),dw=v.videoWidth*f,dh=v.videoHeight*f;tp={x:clamp((p.x*W-(W/2-dw/2))/dw,0,1),y:clamp((p.y*H-(H/2-dh/2))/dh,0,1)};return}
 if(sname=='Text'&&texts[tsel]){drag=true;snap();cv.setPointerCapture(e.pointerId)}};
cv.onpointermove=e=>{if(drag&&texts[tsel]){const p=cp(e);texts[tsel].x=p.x;texts[tsel].y=p.y}};cv.onpointerup=()=>{if(drag){drag=false;sv()}};
$('#q').onchange=e=>$('#res span').textContent=e.target.selectedOptions[0].text+' ▾';
/* export */
$('#ex').onclick=async()=>{if(!segs.length)return;pause();initAudio();await ac.resume();W=+$('#q').value;H=Math.round(W*16/9);cv.width=W;cv.height=H;exporting=true;sel=false;setT(0);await new Promise(r=>setTimeout(r,500));
 if(!window.MediaRecorder){exporting=false;return toast('Browser kee export hin deeggaru')}
 const cs=cv.captureStream(30);dest.stream.getAudioTracks().forEach(t=>cs.addTrack(t));const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'',ch=[];
 rec=new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:W>=1080?1e7:W>=720?6e6:3e6});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
 rec.onstop=()=>{exporting=false;rec=null;$('#ov').style.display='none';const b=new Blob(ch,{type:mime||'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='edit-'+Date.now()+(mime.includes('mp4')?'.mp4':'.webm');document.body.append(a);a.click();a.remove();toast('Export xumurameera ✔')};
 rec.start();$('#ov').style.display='flex';play();const iv=setInterval(()=>{if(!exporting){clearInterval(iv);return}$('#ov').textContent='Exporting… '+Math.round(cur/dur()*100)+'%'},300)};
$('#kf').style.visibility='hidden';$('#pl').innerHTML=ico('play');tbr();requestAnimationFrame(loop);
</script></body></html>
